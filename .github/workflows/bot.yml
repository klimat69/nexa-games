name: telegram-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python bot_oneshot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_URL: https://klimat69.github.io/nexa-games
      - name: Save offset
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f offset.txt ] && git add offset.txt
          git diff --cached --quiet || git commit -m "update offset [skip ci]" && git push || true
